# HiVG grounding head on top of LoopViT-ViT-B-16 (depth=1, max_loop_steps=12, global loop).
# Matches configs/model/loopvit_vitb.yaml's architecture — set backbone_checkpoint to a
# Lightning .ckpt produced by that config (baseline or KD training).
name: "hivg_loopvit_d1"

# ---- Frozen backbone (must match the checkpoint's architecture exactly) ----
visual_embed_dim: 768
num_heads: 12
mlp_ratio: 4.0
loop_core_depth: 1
max_loop_steps: 12
min_loop_steps: 1
add_step_embeddings: false
loop_mode: "global"
loop_schedule: null

text_encoder: "open_clip"        # "open_clip" or "looptext"
text_encoder_name: "ViT-B-16"
embed_dim: 512                   # CLIP projection dim (visual CLS / text EOS / text hidden width for ViT-B-16)
text_seq_len: 77

backbone_checkpoint: null        # path to a trained CLIP-KD Lightning .ckpt (REQUIRED)

# ---- New grounding heads (trained from scratch) ----
vl_hidden_dim: 512
vl_nheads: 8
vl_enc_layers: 6
vl_dropout: 0.1
num_patches: 196                  # 224 / 16 = 14 → 14*14

# ---- HiLoRA ----
hilora_rank: 32
hilora_alpha: 16.0
# Only 1 unique block exists for this depth — hi_lora_stage 1/2/3 are all equivalent (same single block).

hi_lora_stage: 3   # 0=warmup (no LoRA), 1/2/3=cumulative vision HiLoRA + flat text HiLoRA (see GroundingModule.setup)
text_lora: true    # flat (non-staged) LoRA on every text layer, active when hi_lora_stage >= 1
