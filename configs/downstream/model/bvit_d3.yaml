# HiVG grounding head on top of LoopViT-ViT-B-16-perblock (3 distinct blocks,
# loop_schedule=[1, 10, 1] → 12 total block-executions).
# Matches configs/model/loopvit_vitb_perblock.yaml — set backbone_checkpoint to a
# Lightning .ckpt produced by that config.
name: "hivg_loopvit_d3"

# ---- Frozen backbone (must match the checkpoint's architecture exactly) ----
visual_embed_dim: 768
num_heads: 12
mlp_ratio: 4.0
loop_core_depth: 3
max_loop_steps: 12          # ignored in per_block mode (derived from loop_schedule sum)
min_loop_steps: 1
add_step_embeddings: false  # must be false in per_block mode
loop_mode: "per_block"
loop_schedule: [1, 10, 1]

text_encoder: "open_clip"
text_encoder_name: "ViT-B-16"
embed_dim: 512
text_seq_len: 77

backbone_checkpoint: null    # path to a trained CLIP-KD Lightning .ckpt (REQUIRED)

# ---- New grounding heads (trained from scratch) ----
vl_hidden_dim: 512
vl_nheads: 8
vl_enc_layers: 6
vl_dropout: 0.1
num_patches: 196

# ---- HiLoRA ----
hilora_rank: 32
hilora_alpha: 16.0
# 3 distinct blocks, deduplicated by first-execution order (not by raw
# execution count, so the uneven loop_schedule=[1,10,1] doesn't muddy the
# split) → hi_lora_stage 1/2/3 cleanly unlock 1, then 2, then all 3 blocks.

hi_lora_stage: 3   # 0=warmup (no LoRA), 1/2/3=cumulative vision HiLoRA + flat text HiLoRA (see GroundingModule.setup)
text_lora: true    # flat (non-staged) LoRA on every text layer, active when hi_lora_stage >= 1
